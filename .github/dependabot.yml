version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The root module's and the examples' lock files only, not the modules'
  # versions.tf floors: those are deliberately broad (">= 6.45") and pinned
  # exactly only by a consumer's lock file.
  - package-ecosystem: terraform
    directories:
      - /
      - /examples/*
    schedule:
      interval: weekly
    # Our own tags: the default 3-day cooldown is for third-party supply chain.
    cooldown:
      exclude: ["*terraform-aws-keel*"]
    groups:
      providers:
        patterns: ["*"]

  # Keel refs only, so the provider floors in versions.tf stay broad.
  - package-ecosystem: terraform
    directories:
      - /modules/*
    allow:
      - dependency-name: "*terraform-aws-keel*"
    schedule:
      interval: weekly
    # Our own tags: the default 3-day cooldown is for third-party supply chain.
    cooldown:
      exclude: ["*terraform-aws-keel*"]
    groups:
      keel:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
