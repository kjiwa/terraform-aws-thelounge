version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The root module's and the examples' lock files only, not the modules'
  # versions.tf floors: those are deliberately broad (">= 6.0") and pinned
  # exactly only by a consumer's lock file.
  - package-ecosystem: terraform
    directories:
      - /
      - /examples/*
    schedule:
      interval: weekly
    groups:
      providers:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
